name: Build papers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc, crossref, and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc pandoc-crossref \
            texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended fonts-dejavu \
            librsvg2-bin

      - name: List papers
        run: make list

      - name: Build all papers
        run: make all

      - name: Upload built documents
        uses: actions/upload-artifact@v4
        with:
          name: papers
          path: papers/*/public/*
          if-no-files-found: warn
