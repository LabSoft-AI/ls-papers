<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="DejaVu Sans, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; rx: 6; }
    .grp { fill: #f4f6f8; stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 4 3; rx: 8; }
    .lbl { font-size: 13px; fill: #1a1a1a; }
    .lbls { font-size: 11px; fill: #444444; }
    .grplbl { font-size: 12px; fill: #55606b; font-style: italic; }
    .edge { stroke: #333333; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .title { font-size: 15px; fill: #000000; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Korisnik -->
  <rect class="box" x="300" y="20" width="160" height="42" rx="6"/>
  <text class="lbl" x="380" y="40" text-anchor="middle">User (web chat)</text>
  <text class="lbls" x="380" y="55" text-anchor="middle">conversation on the enterprise website</text>

  <!-- Chatbot grupa -->
  <rect class="grp" x="60" y="95" width="640" height="150" rx="8"/>
  <text class="grplbl" x="75" y="113">Conversational agent (AWS Bedrock AgentCore + Strands, Amazon Nova)</text>

  <rect class="box" x="80" y="128" width="180" height="46" rx="6"/>
  <text class="lbl" x="170" y="147" text-anchor="middle">Session management</text>
  <text class="lbls" x="170" y="162" text-anchor="middle">+ fast path (workflow)</text>

  <rect class="box" x="290" y="128" width="180" height="46" rx="6"/>
  <text class="lbl" x="380" y="147" text-anchor="middle">Agentic step</text>
  <text class="lbls" x="380" y="162" text-anchor="middle">enterprise tools (package, order)</text>

  <rect class="box" x="500" y="128" width="180" height="46" rx="6"/>
  <text class="lbl" x="590" y="147" text-anchor="middle">RAG (FAISS)</text>
  <text class="lbls" x="590" y="162" text-anchor="middle">controlled knowledge base</text>

  <rect class="box" x="290" y="188" width="180" height="42" rx="6"/>
  <text class="lbl" x="380" y="207" text-anchor="middle">In-conversation purchase</text>
  <text class="lbls" x="380" y="221" text-anchor="middle">→ enterprise sales API</text>

  <!-- Notifikacije -->
  <rect class="box" x="500" y="280" width="180" height="46" rx="6"/>
  <text class="lbl" x="590" y="299" text-anchor="middle">Notification service</text>
  <text class="lbls" x="590" y="314" text-anchor="middle">qualified lead / confirmation (email)</text>

  <!-- Export -->
  <rect class="box" x="290" y="280" width="180" height="46" rx="6"/>
  <text class="lbl" x="380" y="299" text-anchor="middle">Conversation export</text>
  <text class="lbls" x="380" y="314" text-anchor="middle">S3 data lake (sessions)</text>

  <!-- Data platform grupa -->
  <rect class="grp" x="60" y="360" width="640" height="120" rx="8"/>
  <text class="grplbl" x="75" y="378">Data platform (measurement instrument)</text>

  <rect class="box" x="120" y="392" width="230" height="46" rx="6"/>
  <text class="lbl" x="235" y="411" text-anchor="middle">Conversation analysis (Amazon Nova)</text>
  <text class="lbls" x="235" y="426" text-anchor="middle">sentiment, outcome, classification</text>

  <rect class="box" x="400" y="392" width="230" height="46" rx="6"/>
  <text class="lbl" x="515" y="411" text-anchor="middle">Metric aggregation + API</text>
  <text class="lbls" x="515" y="426" text-anchor="middle">conversion, revenue, AI share</text>

  <!-- Metrike izlaz -->
  <rect class="box" x="300" y="505" width="160" height="40" rx="6"/>
  <text class="lbl" x="380" y="529" text-anchor="middle">Measurable outcomes</text>

  <!-- Edges -->
  <path class="edge" d="M 380 62 L 380 128"/>
  <path class="edge" d="M 380 174 L 380 188"/>
  <path class="edge" d="M 470 151 L 500 151"/>
  <path class="edge" d="M 470 209 L 590 209 L 590 280"/>
  <path class="edge" d="M 380 230 L 380 280"/>
  <path class="edge" d="M 380 326 L 380 392 L 350 392"/>
  <path class="edge" d="M 235 438 L 235 460 L 380 460 L 400 415"/>
  <path class="edge" d="M 515 438 L 515 480 L 380 480 L 380 505"/>
</svg>
